[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norm_enforcement"
version = "0.1.0"
description = "Code and data for 'Norm Enforcement for AI Agents: Robustly Shaping Behavior in Multi-Agent Systems'."
authors = [
  { name = "Yaowen Ye", email = "elwin@berkeley.edu" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp",
    "chz",
    "openai",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
plots = [
    "matplotlib",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/helloelwin/norm-enforcement"

[tool.setuptools.packages.find]
where = ["."]
include = ["norm_enforcement*"]
